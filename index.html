<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Adam's Court Diary</title>
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;
  --acc:#22c55e;--acc2:#38bdf8;--danger:#f87171;--pill:#78350f;--pillt:#fbbf24;
  --wa:#25d366;--inp:#0f172a;--soft:#0f172a66;--ov:rgba(2,6,23,.78);--fs-base:14px;
}
body[data-theme="day"]{
  --bg:#eef2f7;--card:#ffffff;--line:#cbd5e1;--txt:#0f172a;--mut:#475569;
  --acc:#15803d;--acc2:#0369a1;--danger:#b91c1c;--pill:#fef3c7;--pillt:#92400e;
  --inp:#f8fafc;--soft:#e2e8f0aa;--ov:rgba(15,23,42,.45);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);padding:8px;font-size:var(--fs-base)}
h1{font-size:18px;margin:0 0 10px;text-align:center;color:var(--acc2)}
.bar{display:flex;gap:6px;margin-bottom:10px}
.bar input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:10px;border-radius:8px;font-size:14px}
.bar button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:0 12px;font-size:16px;cursor:pointer}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-head button{background:var(--inp);border:1px solid var(--line);color:var(--acc2);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:bold}
.cal-mid{font-weight:bold;color:var(--txt)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-wd div{font-size:10px;color:var(--mut);padding:4px 0}
.cal-c{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--soft);border:1px solid transparent;border-radius:6px;font-size:12px;cursor:pointer;color:var(--txt)}
.cal-c.blank{background:transparent;cursor:default}
.cal-c.td{border-color:var(--line)}
.cal-c.sel{background:var(--acc2);color:#06283d;font-weight:bold}
/* BADGES */
.badge-count{position:absolute;bottom:2px;right:2px;background:var(--acc);color:#fff;font-size:9px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1;z-index:2}
.badge-overdue{position:absolute;top:2px;left:2px;background:var(--danger);color:#fff;font-size:9px;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1;z-index:3;box-shadow:0 0 3px rgba(248,113,113,0.8)}
table.reg{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
table.reg th, table.reg td{border:1px solid var(--line);padding:6px;vertical-align:top;word-break:break-word}
table.reg th{background:var(--soft);color:var(--mut);text-transform:uppercase;font-size:10px;text-align:left}
table.reg tbody tr{cursor:pointer}
table.reg tbody tr:active{background:var(--inp)}
details.main{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.main>summary{padding:12px;font-weight:bold;cursor:pointer;list-style:none;text-align:center;color:var(--acc2)}
details.main>summary::-webkit-details-marker{display:none}
.form-group{padding:10px;border-top:1px solid var(--line)}
label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
input,textarea,select{width:100%;background:var(--inp);border:1px solid var(--line);color:var(--txt);padding:8px;border-radius:6px;font-size:13px;font-family:inherit;margin-bottom:6px}
.btnrow{display:flex;gap:8px;padding:10px}
.go{flex:1;background:var(--acc);color:#052e16;border:0;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer}
.cancelbtn{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:12px 14px;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:var(--ov);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal-bg.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:400px;width:100%;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.modal h2{margin:0 0 10px;font-size:16px;color:var(--acc2)}
.modal .close-x{float:right;cursor:pointer;color:var(--mut);font-size:20px;line-height:1}
.info-row{margin-bottom:8px;font-size:13px}
.info-label{color:var(--mut);font-size:11px;display:block}
.actions{display:flex;gap:8px;margin-top:10px}
.act-btn{flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--inp);color:var(--txt);cursor:pointer;text-align:center;text-decoration:none;font-size:12px}
.act-btn.del{color:var(--danger);border-color:var(--danger)}
.empty-msg{text-align:center;color:var(--mut);padding:20px;font-size:13px}
</style>
</head>
<body data-theme="night">

<h1>⚖️ Adam's Court Diary</h1>

<div class="bar">
  <input id="q" type="search" placeholder="Search case no, party...">
  <button id="clr">✕</button>
</div>

<!-- CALENDAR -->
<div class="cal">
  <div class="cal-head">
    <button id="prevMonth">◀</button>
    <span class="cal-mid" id="calLabel">—</span>
    <button id="nextMonth">▶</button>
    <button id="todayBtn" style="color:var(--acc)">Today</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- TABLE -->
<table class="reg">
  <thead>
    <tr>
      <th style="width:5%">Sr</th>
      <th style="width:20%">Court/No</th>
      <th style="width:35%">Party</th>
      <th style="width:20%">Status</th>
      <th style="width:20%">Next Date</th>
    </tr>
  </thead>
  <tbody id="listBody"></tbody>
</table>

<!-- FORM -->
<details class="main">
  <summary>➕ Add New Case</summary>
  <div class="form-group">
    <label>Date of Hearing</label>
    <input type="date" id="fDate">
    
    <label>Court Name & No.</label>
    <input type="text" id="fCourt" placeholder="ACJM - 3">
    
    <label>Case Number</label>
    <input type="text" id="fCaseNo" required placeholder="123/2026">
    
    <label>Petitioner vs Respondent</label>
    <input type="text" id="fParty" placeholder="Rahul vs Suresh">
    
    <label>Today's Proceeding</label>
    <textarea id="fProc" rows="2" placeholder="Charge framed..."></textarea>
    
    <label>Next Date (If any)</label>
    <input type="date" id="fNext">
    
    <label>Section / Act</label>
    <input type="text" id="fSec" placeholder="IPC 302 / BNS 103">
  </div>
  <div class="btnrow">
    <button class="go" id="saveBtn">SAVE CASE</button>
    <button class="cancelbtn" id="cancelBtn">Cancel</button>
  </div>
</details>

<!-- MODAL FOR DETAILS -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <span class="close-x" id="closeModal">×</span>
    <h2 id="mTitle">Case Details</h2>
    <div id="mContent"></div>
    <div class="actions">
      <a href="#" class="act-btn" id="mEdit">✏️ Edit</a>
      <a href="#" class="act-btn del" id="mDel">🗑 Delete</a>
    </div>
  </div>
</div>

<script>
// --- CONFIG ---
var STORAGE_KEY = 'adam_diary_v3_stable';
var cases = [];
var currentDate = new Date();
var selectedDateStr = formatDate(currentDate); // YYYY-MM-DD
var editingId = null;

// --- INIT ---
function init() {
  loadData();
  renderCalendar();
  renderTable();
  
  // Event Listeners
  document.getElementById('prevMonth').onclick = () => changeMonth(-1);
  document.getElementById('nextMonth').onclick = () => changeMonth(1);
  document.getElementById('todayBtn').onclick = () => {
    currentDate = new Date();
    selectedDateStr = formatDate(currentDate);
    renderCalendar();
    renderTable();
  };
  
  document.getElementById('saveBtn').onclick = saveCase;
  document.getElementById('cancelBtn').onclick = resetForm;
  document.getElementById('closeModal').onclick = closeModal;
  document.getElementById('q').oninput = renderTable;
  document.getElementById('clr').onclick = () => {
    document.getElementById('q').value = '';
    renderTable();
  };
  
  // Modal Actions
  document.getElementById('mEdit').onclick = editCase;
  document.getElementById('mDel').onclick = deleteCase;
}

// --- DATA HELPERS ---
function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) cases = JSON.parse(raw);
  } catch(e) { cases = []; }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cases));
  } catch(e) { alert("Storage Full! Delete old photos/cases."); }
}

function formatDate(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getDisplayDate(isoStr) {
  if(!isoStr) return '-';
  var parts = isoStr.split('-');
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
}

// --- CALENDAR LOGIC WITH BADGES ---
function renderCalendar() {
  var grid = document.getElementById('calGrid');
  var label = document.getElementById('calLabel');
  grid.innerHTML = '';
  
  var year = currentDate.getFullYear();
  var month = currentDate.getMonth();
  label.textContent = new Intl.DateTimeFormat('en-IN', {month:'short', year:'numeric'}).format(currentDate);
  
  // Weekdays Header
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(w => {
    var div = document.createElement('div');
    div.className = 'cal-wd';
    div.textContent = w;
    grid.appendChild(div);
  });
  
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  
  // Empty slots before start
  for(let i=0; i<firstDay; i++) {
    var blank = document.createElement('div');
    blank.className = 'cal-c blank';
    grid.appendChild(blank);
  }
  
  // Days
  for(let d=1; d<=daysInMonth; d++) {
    var dateObj = new Date(year, month, d);
    var isoStr = formatDate(dateObj);
    var cell = document.createElement('div');
    cell.className = 'cal-c';
    if(isoStr === selectedDateStr) cell.classList.add('sel');
    if(isoStr === formatDate(new Date())) cell.classList.add('td');
    
    cell.onclick = () => {
      selectedDateStr = isoStr;
      renderCalendar();
      renderTable();
    };
    
    // Calculate Stats for this date
    var dayCases = cases.filter(c => c.date === isoStr);
    var count = dayCases.length;
    var hasOverdue = false;
    
    // Check Overdue Logic
    var todayIso = formatDate(new Date());
    dayCases.forEach(c => {
      if(c.nextDate && c.nextDate < todayIso) {
        hasOverdue = true;
      }
    });
    
    // Render Content
    cell.innerHTML = `<span>${d}</span>`;
    
    if(count > 0) {
      var badge = document.createElement('div');
      badge.className = 'badge-count';
      badge.textContent = count;
      cell.appendChild(badge);
    }
    
    if(hasOverdue) {
      var overBadge = document.createElement('div');
      overBadge.className = 'badge-overdue';
      overBadge.textContent = '!';
      cell.appendChild(overBadge);
    }
    
    grid.appendChild(cell);
  }
}

function changeMonth(dir) {
  currentDate.setMonth(currentDate.getMonth() + dir);
  renderCalendar();
}

// --- TABLE LOGIC ---
function renderTable() {
  var tbody = document.getElementById('listBody');
  tbody.innerHTML = '';
  
  var query = document.getElementById('q').value.toLowerCase();
  
  // Filter by Selected Date AND Search Query
  var filtered = cases.filter(c => {
    var matchDate = c.date === selectedDateStr;
    var matchQuery = !query || 
                     (c.caseNo && c.caseNo.toLowerCase().includes(query)) ||
                     (c.party && c.party.toLowerCase().includes(query)) ||
                     (c.court && c.court.toLowerCase().includes(query));
    return matchDate && matchQuery;
  });
  
  if(filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">No cases found for this date.</td></tr>';
    return;
  }
  
  filtered.forEach((c, index) => {
    var tr = document.createElement('tr');
    tr.onclick = () => openModal(c.id);
    
    // Highlight Next Date if Overdue
    var nextDateStyle = "";
    if(c.nextDate && c.nextDate < formatDate(new Date())) {
       nextDateStyle = "color:var(--danger); font-weight:bold;";
    }
    
    tr.innerHTML = `
      <td>${index+1}</td>
      <td><strong>${esc(c.court)}</strong><br><small>${esc(c.caseNo)}</small></td>
      <td>${esc(c.party)}</td>
      <td><small>${esc(c.proc)}</small></td>
      <td style="${nextDateStyle}">${getDisplayDate(c.nextDate)}</td>
    `;
    tbody.appendChild(tr);
  });
}

// --- FORM LOGIC ---
function saveCase() {
  var caseNo = document.getElementById('fCaseNo').value.trim();
  if(!caseNo) { alert("Case Number is Required"); return; }
  
  var newCase = {
    id: editingId || Date.now(),
    date: selectedDateStr, // Saves to currently selected calendar date
    court: document.getElementById('fCourt').value,
    caseNo: caseNo,
    party: document.getElementById('fParty').value,
    proc: document.getElementById('fProc').value,
    nextDate: document.getElementById('fNext').value,
    sec: document.getElementById('fSec').value
  };
  
  if(editingId) {
    var idx = cases.findIndex(c => c.id == editingId);
    if(idx !== -1) cases[idx] = newCase;
  } else {
    cases.push(newCase);
  }
  
  saveData();
  resetForm();
  renderCalendar();
  renderTable();
  alert("Saved Successfully!");
}

function resetForm() {
  editingId = null;
  document.getElementById('fCourt').value = '';
  document.getElementById('fCaseNo').value = '';
  document.getElementById('fParty').value = '';
  document.getElementById('fProc').value = '';
  document.getElementById('fNext').value = '';
  document.getElementById('fSec').value = '';
  document.querySelector('details.main').removeAttribute('open');
}

// --- MODAL LOGIC ---
function openModal(id) {
  var c = cases.find(x => x.id == id);
  if(!c) return;
  
  document.getElementById('mTitle').textContent = c.caseNo;
  
  var html = `
    <div class="info-row"><span class="info-label">Court:</span> ${esc(c.court)}</div>
    <div class="info-row"><span class="info-label">Parties:</span> ${esc(c.party)}</div>
    <div class="info-row"><span class="info-label">Proceeding:</span> ${esc(c.proc)}</div>
    <div class="info-row"><span class="info-label">Section:</span> ${esc(c.sec)}</div>
    <div class="info-row"><span class="info-label">Hearing Date:</span> ${getDisplayDate(c.date)}</div>
    <div class="info-row"><span class="info-label">Next Date:</span> <strong>${getDisplayDate(c.nextDate)}</strong></div>
  `;
  
  document.getElementById('mContent').innerHTML = html;
  document.getElementById('modalBg').classList.add('on');
  
  // Store ID for Edit/Delete buttons
  document.getElementById('mEdit').dataset.id = id;
  document.getElementById('mDel').dataset.id = id;
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('on');
}

function editCase(e) {
  e.preventDefault();
  var id = parseInt(this.dataset.id);
  var c = cases.find(x => x.id == id);
  if(!c) return;
  
  editingId = id;
  selectedDateStr = c.date; // Switch calendar to that date
  
  document.getElementById('fCourt').value = c.court;
  document.getElementById('fCaseNo').value = c.caseNo;
  document.getElementById('fParty').value = c.party;
  document.getElementById('fProc').value = c.proc;
  document.getElementById('fNext').value = c.nextDate;
  document.getElementById('fSec').value = c.sec;
  
  document.querySelector('details.main').setAttribute('open', '');
  closeModal();
  renderCalendar();
  renderTable();
}

function deleteCase(e) {
  e.preventDefault();
  if(confirm("Are you sure?")) {
    var id = parseInt(this.dataset.id);
    cases = cases.filter(c => c.id != id);
    saveData();
    closeModal();
    renderCalendar();
    renderTable();
  }
}

// --- UTILS ---
function esc(str) {
  if(!str) return '';
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Start App
init();
</script>
</body>
</html>
