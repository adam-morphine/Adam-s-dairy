<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Adam's Court Diary</title>
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;
  --acc:#22c55e;--acc2:#38bdf8;--danger:#f87171;--pill:#78350f;--pillt:#fbbf24;
  --wa:#25d366;--inp:#0f172a;--soft:#0f172a66;--soft2:#0f172a88;--soft3:#0f172a55;
  --ov:rgba(2,6,23,.78);--ov2:rgba(2,6,23,.85);--fs-base:13px;
}
body[data-theme="day"]{
  --bg:#eef2f7;--card:#ffffff;--line:#cbd5e1;--txt:#0f172a;--mut:#475569;
  --acc:#15803d;--acc2:#0369a1;--danger:#b91c1c;--pill:#fef3c7;--pillt:#92400e;
  --inp:#f8fafc;--soft:#e2e8f0aa;--soft2:#e2e8f0cc;--soft3:#f1f5f9aa;
  --ov:rgba(15,23,42,.45);--ov2:rgba(15,23,42,.55);
}
@media (prefers-color-scheme: light){
  body[data-theme="system"]{
    --bg:#eef2f7;--card:#ffffff;--line:#cbd5e1;--txt:#0f172a;--mut:#475569;
    --acc:#15803d;--acc2:#0369a1;--danger:#b91c1c;--pill:#fef3c7;--pillt:#92400e;
    --inp:#f8fafc;--soft:#e2e8f0aa;--soft2:#e2e8f0cc;--soft3:#f1f5f9aa;
    --ov:rgba(15,23,42,.45);--ov2:rgba(15,23,42,.55);
  }
}
body.bold,body.bold *{font-weight:700!important}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);padding:8px;font-size:var(--fs-base)}
h1{font-size:calc(var(--fs-base) + 6px);margin:0 0 2px;font-weight:700}
.sub{color:var(--mut);font-size:calc(var(--fs-base) - 1px);margin:0 0 8px}
#intro{margin:0 0 8px}
.off{display:inline-flex;align-items:center;gap:6px;background:#14532d55;color:#86efac;font-size:calc(var(--fs-base) - 2px);padding:3px 8px;border-radius:999px;margin-bottom:6px}
.off i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block}
.tip{color:var(--acc2);font-size:calc(var(--fs-base) - 2px);margin:0 0 6px}
.warn{color:#fca5a5;font-size:calc(var(--fs-base) - 2px);margin:0 0 6px;line-height:1.4}
.ix{display:inline-block;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 10px;font-size:calc(var(--fs-base) - 1px);cursor:pointer;margin-top:2px}
.bar{display:flex;gap:6px;margin-bottom:6px}
.bar input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 10px;border-radius:10px;font-size:calc(var(--fs-base) + 1px)}
.bar button{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:0 12px;font-size:calc(var(--fs-base) + 3px);cursor:pointer}
.count{color:var(--mut);font-size:calc(var(--fs-base) - 1px);margin:0 0 4px}
.autostat{color:var(--acc);font-size:calc(var(--fs-base) - 2px);margin:0 0 8px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 8px;margin-bottom:10px}
.cal-head{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cal-head button{background:var(--inp);border:1px solid var(--line);color:var(--acc2);border-radius:8px;padding:6px 7px;font-size:calc(var(--fs-base) - 1px);cursor:pointer;flex:0 0 auto}
.cal-head .cal-today{color:var(--acc);font-weight:700}
.cal-mid{flex:1;min-width:92px;background:var(--inp);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 6px;font-size:calc(var(--fs-base) - 1px);font-weight:700;text-align:center;cursor:pointer}
.cloud-mini{display:flex;gap:4px;flex:0 0 auto;flex-wrap:wrap}
.cbtn{border-radius:8px;padding:6px 7px;font-size:calc(var(--fs-base) - 2px);font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--inp);display:inline-flex;align-items:center;gap:4px}
.cbtn.dl{color:#86efac;border-color:#166534}
.cbtn.up{color:#fde68a;border-color:#b45309}
.cbtn.pr{color:#c4b5fd;border-color:#6d28d9}
.cbtn.st{color:var(--acc2);border-color:var(--line)}
.cal-body{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.cal.open .cal-body{display:block}
.cal-title{text-align:center;font-weight:700;font-size:calc(var(--fs-base) - 1px);color:var(--acc2);margin-bottom:4px}
.cal-hindu{text-align:center;font-size:calc(var(--fs-base) - 2px);color:var(--acc);margin:0 0 7px;min-height:16px;line-height:1.35}
.cal-hindu a{color:var(--acc2);text-decoration:none;font-weight:700}
.cal-jump{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.cal-jump label{font-size:calc(var(--fs-base) - 3px);color:var(--mut)}
.cal-jump input{flex:1;background:var(--inp);border:1px solid var(--line);color:var(--txt);padding:6px 8px;border-radius:8px;font-size:calc(var(--fs-base) - 1px);font-family:inherit}
.cal-wd,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-wd div{text-align:center;font-size:calc(var(--fs-base) - 4px);color:var(--mut);padding:2px 0;line-height:1.2}
.cal-c{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--soft);border:1px solid transparent;border-radius:8px;font-size:calc(var(--fs-base) - 1px);cursor:pointer;color:var(--txt)}
.cal-c.blank{background:transparent;cursor:default}
.cal-c.td{border-color:var(--line)}
.cal-c.sel{background:var(--acc2);color:#06283d;font-weight:700}
.cal-c .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--acc)}
.cal-c.sel .dot{background:#052e16}
details.main{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.main>summary{padding:11px 12px;font-weight:600;cursor:pointer;list-style:none;font-size:calc(var(--fs-base) + 1px);text-align:center}
details.main>summary::-webkit-details-marker{display:none}
details.main>summary span.ar{float:right;color:var(--acc2)}
.grp{border:1px solid var(--line);border-radius:10px;margin:0 12px 8px;overflow:hidden}
.grp>summary{padding:9px 11px;font-weight:600;cursor:pointer;background:var(--soft2);list-style:none;font-size:calc(var(--fs-base) - 1px);text-align:left}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary b{color:var(--acc2)}
.inner{padding:9px 11px 11px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inner .full{grid-column:1/-1}
label{font-size:calc(var(--fs-base) - 3px);color:var(--mut);display:block;margin-bottom:2px}
input,textarea,select{width:100%;background:var(--inp);border:1px solid var(--line);color:var(--txt);padding:8px;border-radius:8px;font-size:calc(var(--fs-base) - 1px);font-family:inherit}
input[type=file]{padding:6px;font-size:calc(var(--fs-base) - 2px)}
textarea{resize:vertical;min-height:40px}
.phrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.phrow input{flex:1}
.phrow button{flex:0 0 auto;background:var(--inp);border:1px solid var(--line);color:var(--mut);border-radius:8px;width:34px;height:36px;font-size:16px;cursor:pointer}
.btnrow{display:flex;gap:8px;padding:0 12px 12px}
.go{flex:1;background:var(--acc);color:#052e16;border:0;padding:11px;border-radius:10px;font-weight:700;font-size:calc(var(--fs-base) + 1px);cursor:pointer}
.cancelbtn{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:11px 14px;font-size:var(--fs-base);cursor:pointer}
table.reg{width:100%;border-collapse:collapse;table-layout:fixed;font-size:calc(var(--fs-base) - 3px);background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
table.reg thead td{border:1px solid var(--line);padding:3px 4px;vertical-align:bottom}
table.reg thead tr:first-child td{color:var(--txt);font-weight:700;text-transform:uppercase;letter-spacing:.3px;font-size:calc(var(--fs-base) - 4px)}
table.reg thead tr:last-child td{color:var(--mut);text-transform:uppercase;letter-spacing:.3px;font-size:calc(var(--fs-base) - 5px)}
table.reg tbody tr{cursor:pointer}
table.reg tbody tr:active{background:var(--inp)}
table.reg tbody td{border:1px solid var(--line);padding:3px 4px;vertical-align:top;word-break:break-word}
td.sr{text-align:center;font-weight:700;color:var(--acc2);font-size:calc(var(--fs-base) - 2px)}
td.nextcell{cursor:pointer}
td.nextcell:active{background:var(--inp)}
.u,.d{display:block;line-height:1.3}
.d{border-top:1px dashed var(--line);margin-top:2px;padding-top:2px}
.val.b{font-weight:700;color:var(--acc2)}
.pill{display:inline-block;background:var(--pill);color:var(--pillt);border:1px solid #b45309;padding:1px 5px;border-radius:7px;font-weight:700}
.setnext{background:var(--inp);border:1px dashed var(--acc2);color:var(--acc2);border-radius:7px;padding:2px 6px;font-size:calc(var(--fs-base) - 3px);font-weight:700;cursor:pointer;line-height:1.3}
.empty{text-align:center;color:var(--mut);padding:18px 8px;font-size:calc(var(--fs-base) - 1px)}
mark{background:#7c2d12;color:#fed7aa;border-radius:3px;padding:0 1px}
.modal-bg{position:fixed;inset:0;background:var(--ov);display:none;align-items:flex-start;justify-content:center;padding:12px;z-index:60;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:480px;width:100%;margin:auto;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.modal .mh h2{margin:0;font-size:calc(var(--fs-base) + 3px);color:var(--acc2);font-weight:700}
.modal .mh .mc{font-size:calc(var(--fs-base) - 1px);color:var(--mut);margin-top:2px;line-height:1.4}
.modal .x{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:5px 10px;font-size:calc(var(--fs-base) + 1px);cursor:pointer;flex:0 0 auto}
.sec{border:1px solid var(--line);border-radius:11px;padding:9px 10px;margin-bottom:10px;background:var(--soft3)}
.sec h3{margin:0 0 7px;font-size:calc(var(--fs-base) - 2px);color:var(--acc);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.dl{font-size:var(--fs-base);line-height:1.7}
.dl span{color:var(--mut)}
.dl a{color:var(--acc2);text-decoration:none}
.numline{margin:6px 0;padding:6px 0;border-top:1px dashed var(--line)}
.numline:first-of-type{border-top:0}
.numline .nl{font-size:calc(var(--fs-base) - 1px);color:var(--acc2);font-weight:700;margin-bottom:3px}
.actrow{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.abtn{flex:1;min-width:80px;border-radius:9px;padding:8px 6px;font-size:calc(var(--fs-base) - 1px);font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--inp);color:var(--acc2);text-decoration:none;text-align:center;display:inline-block}
.abtn.wa{background:var(--wa);color:#04331a;border-color:var(--wa)}
.abtn.call{color:var(--acc)}
.docgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}
.docwrap{position:relative}
.thumb{width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid var(--line);border-radius:9px;display:block;background:var(--inp);cursor:pointer}
.pdfcard{width:100%;aspect-ratio:1/1;border:1px solid var(--line);border-radius:9px;background:var(--inp);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:5px;text-align:center}
.pdfcard .ic{font-size:22px}
.pdfcard .nm{font-size:calc(var(--fs-base) - 3px);color:var(--mut);word-break:break-all;line-height:1.2}
.rmx{position:absolute;top:-5px;right:-5px;background:#7f1d1d;color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--inp);border:1px solid var(--line);color:var(--txt);font-size:calc(var(--fs-base) - 2px);padding:3px 8px;border-radius:7px}
.addfile{display:inline-flex;align-items:center;gap:6px;background:var(--inp);border:1px dashed var(--acc2);color:var(--acc2);border-radius:9px;padding:7px 11px;font-size:calc(var(--fs-base) - 1px);font-weight:700;cursor:pointer;margin-top:7px}
.addfile input{display:none}
.note{font-size:calc(var(--fs-base) - 2px);color:var(--mut);margin-top:5px;line-height:1.4}
.mrow{display:flex;gap:8px;margin-top:4px}
.mbtn{flex:1;border-radius:10px;padding:11px;font-size:var(--fs-base);font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--inp)}
.mbtn.e{color:var(--acc2)}
.mbtn.d{color:var(--danger);border-color:#7f1d1d}
.libitem{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--inp);border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:calc(var(--fs-base) - 2px);margin-bottom:4px;word-break:break-word}
.rm{background:transparent;border:1px solid #7f1d1d;color:var(--danger);border-radius:6px;padding:2px 7px;font-size:calc(var(--fs-base) - 2px);cursor:pointer;flex:0 0 auto}
.libnote{font-size:calc(var(--fs-base) - 2px);color:var(--mut);margin:4px 0 8px;line-height:1.4}
.mini{background:var(--acc2);color:#06283d;border:0;border-radius:8px;padding:7px 12px;font-size:calc(var(--fs-base) - 1px);font-weight:700;cursor:pointer;margin-top:6px}
.mini.g{background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:600}
.hint{font-size:calc(var(--fs-base) - 3px);color:var(--mut);margin-top:3px}
.backup-pop,.settings-pop,.prompt-pop{position:fixed;inset:0;background:var(--ov2);display:none;align-items:center;justify-content:center;padding:16px;z-index:80}
.backup-pop.on,.settings-pop.on,.prompt-pop.on{display:flex}
.backup-card,.settings-card,.prompt-card{background:var(--card);border:1px solid var(--acc2);border-radius:16px;max-width:420px;width:100%;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto}
.backup-card,.prompt-card{text-align:center}
.backup-card h3,.settings-card h3,.prompt-card h3{margin:0 0 14px;font-size:calc(var(--fs-base) + 3px);color:var(--acc2);font-weight:700;text-align:center}
.backup-card p,.prompt-card p{margin:0 0 14px;font-size:calc(var(--fs-base) - 1px);color:var(--mut);line-height:1.5}
.bk-row{display:flex;gap:8px}
.bk-btn{flex:1;border-radius:10px;padding:11px;font-size:var(--fs-base);font-weight:700;cursor:pointer;border:0}
.bk-now{background:var(--acc);color:#052e16}
.bk-later{background:transparent;border:1px solid var(--line);color:var(--mut)}
.set-grp{margin-bottom:14px;border-top:1px solid var(--line);padding-top:12px}
.set-grp h4{margin:0 0 8px;font-size:calc(var(--fs-base) - 1px);color:var(--txt);font-weight:700}
.set-opt{display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;font-size:calc(var(--fs-base) - 1px)}
.set-opt input[type=radio],.set-opt input[type=checkbox]{accent-color:var(--acc2);width:18px;height:18px;cursor:pointer}
.set-save{width:100%;background:var(--acc);color:#052e16;border:0;padding:11px;border-radius:10px;font-weight:700;font-size:calc(var(--fs-base) + 1px);cursor:pointer;margin-top:6px}
.gbtn{width:100%;border-radius:10px;padding:10px;font-size:calc(var(--fs-base) - 1px);font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--inp);color:var(--acc2);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.gbtn.g{border-color:#1d4ed8;color:#93c5fd}
.gnote{font-size:calc(var(--fs-base) - 3px);color:var(--mut);margin-top:6px;line-height:1.4}
#nextPicker{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0.01;border:0;padding:0;margin:0;z-index:-1}
@media(orientation:landscape){
  table.reg{font-size:calc(var(--fs-base) - 1px)}
  td.sr{font-size:var(--fs-base)}
  table.reg thead tr:first-child td{font-size:calc(var(--fs-base) - 2px)}
  table.reg thead tr:last-child td{font-size:calc(var(--fs-base) - 3px)}
  .cal-c{font-size:var(--fs-base)}
}
@media(max-width:380px){
  .inner{grid-template-columns:1fr}
  .docgrid{grid-template-columns:repeat(2,1fr)}
  .cal-mid{min-width:82px}
}
</style>
</head>
<body data-theme="night">
<h1>⚖️ Adam's Court Diary</h1>
<p class="sub" id="sub" hidden data-k="sub"></p>

<div id="intro" hidden>
  <div class="off"><i></i> <span data-k="intro_off"></span></div>
  <p class="tip" data-k="intro_tip"></p>
  <p class="warn" data-k="intro_warn"></p>
  <button class="ix" type="button" id="ix" data-k="intro_ok"></button>
</div>

<div class="bar">
  <input id="q" type="search" data-ph="search">
  <button id="clr" title="Clear">✕</button>
</div>
<p class="count" id="count"></p>
<p class="autostat" id="autoStat" hidden></p>

<div class="cal" id="cal">
  <div class="cal-head">
    <button type="button" class="cal-today" data-nav="0" data-k="today"></button>
    <button class="cbtn dl" type="button" id="bkNow" data-k="save_btn"></button>
    <button type="button" data-nav="-1">◀</button>
    <button type="button" class="cal-mid" id="calMid">📅 —</button>
    <button type="button" data-nav="1">▶</button>
    <button class="cbtn up" type="button" id="rsBtn" data-k="restore_btn"></button>
    <button class="cbtn pr" type="button" id="prtBtn" data-k="print_btn"></button>
    <button class="cbtn st" type="button" id="stBtn" title="Settings">⚙️</button>
    <input type="file" id="rsFile" accept=".json,application/json" style="display:none">
  </div>
  <div class="cal-body">
    <div class="cal-title" id="calTitle">—</div>
    <div class="cal-hindu" id="calHindu"></div>
    <div class="cal-jump">
      <label data-k="jump_lbl"></label>
      <input type="date" id="jump">
    </div>
    <div class="cal-wd" id="calWd"></div>
    <div class="cal-g" id="calG"></div>
  </div>
</div>

<table class="reg" id="tbl">
  <colgroup>
    <col style="width:5%">
    <col style="width:15%">
    <col style="width:16%">
    <col style="width:30%">
    <col style="width:16%">
    <col style="width:18%">
  </colgroup>
  <thead>
    <tr>
      <td class="sr" data-k="c_sr"></td>
      <td data-k="c_last"></td>
      <td data-k="c_court"></td>
      <td data-k="c_party"></td>
      <td data-k="c_ps"></td>
      <td data-k="c_next"></td>
    </tr>
    <tr>
      <td class="sr"></td>
      <td data-k="c_last_s"></td>
      <td data-k="c_court_s"></td>
      <td data-k="c_party_s"></td>
      <td data-k="c_ps_s"></td>
      <td data-k="c_next_s"></td>
    </tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<details class="main">
  <summary><span id="fs" data-k="fs_new"></span> <span class="ar">▾</span></summary>

  <details class="grp" open>
    <summary><b data-k="g_face"></b></summary>
    <div class="inner">
      <div><label data-k="l_lastdate"></label><input name="lastDate" type="date"></div>
      <div><label data-k="l_pervious"></label><input name="lastProc" data-ph="ph_pervious"></div>
      <div><label data-k="l_courtname"></label><input name="court" data-ph="ph_court"></div>
      <div><label data-k="l_courtno"></label><input name="courtNo" data-ph="ph_courtno"></div>
      <div class="full"><label data-k="l_caseno"></label><input name="caseNumber" required data-ph="ph_caseno"></div>

function txt(k){
  var h=I18N.hi[k], e=I18N.en[k];
  if(LANG==='bi'){ if(h!=null&&e!=null&&h!==e)return h+' / '+e; return h!=null?h:(e!=null?e:k); }
  if(LANG==='en') return e!=null?e:(h!=null?h:k);
  return h!=null?h:(e!=null?e:k);
}
function applyI18n(){
  document.querySelectorAll('[data-k]').forEach(function(el){el.textContent=txt(el.getAttribute('data-k'));});
  document.querySelectorAll('[data-ph]').forEach(function(el){el.placeholder=txt(el.getAttribute('data-ph'));});
  document.documentElement.lang=(LANG==='en'?'en':'hi');
}

function ensureLog(c){
  if(!c.log)c.log={};
  var base=c.holdingDate||c.nextDate||todayISO();
  if(base && !c.log[base]){
    var migrNext=(c.nextDate && c.nextDate!==base)?c.nextDate:'';
    c.log[base]={prevDate:c.lastDate||'',prevProc:c.lastProc||'',todayProc:c.todayProc||'',nextDate:migrNext,nextProc:migrNext?(c.nextProc||''):''};
  }
  var bEntry=c.log[base];
  if(bEntry && bEntry.nextDate && bEntry.nextDate!==base && !c.log[bEntry.nextDate]){
    c.log[bEntry.nextDate]={prevDate:base,prevProc:bEntry.todayProc||'',todayProc:bEntry.nextProc||'',nextDate:'',nextProc:''};
  }
  return c.log;
}
function getEntry(c,date){
  ensureLog(c);
  if(!c.log[date])c.log[date]={prevDate:'',prevProc:'',todayProc:'',nextDate:'',nextProc:''};
  return c.log[date];
}
function hasDate(c,date){ return !!(c && c.log && c.log[date]); }
function caseDatesSet(){

    ensureLog(cases[i]);
    var ks=Object.keys(cases[i].log);

  }
  return s;
}

}})();

function compressImage(file,maxDim,quality){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var w=img.width,h=img.height,sc=Math.min(1,maxDim/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res({n:file.name,t:'image/jpeg',d:cv.toDataURL('image/jpeg',quality)});};img.onerror=rej;img.src=e.target.result;};r.onerror=rej;r.readAsDataURL(file);});}
function readPdf(file){return new Promise(function(res,rej){if(file.size>2.5*1024*1024){rej('badi');return;}var r=new FileReader();r.onload=function(e){res({n:file.name,t:file.type||'application/pdf',d:e.target.result});};r.onerror=rej;r.readAsDataURL(file);});}
function readOne(file){if(file.type&&file.type.indexOf('image')===0)return compressImage(file,1000,0.6);if(file.type&&file.type.indexOf('pdf')>=0)return readPdf(file);return Promise.reject('type');}
function addFilesToCase(l,c,done){var ps=[];for(var i=0;i<l.length;i++){(function(f){ps.push(readOne(f).catch(function(){return null;}));})(l[i]);}Promise.all(ps).then(function(arr){var added=0;for(var k=0;k<arr.length;k++){if(arr[k]){c.files.push(arr[k]);added++;}}if(added)saveCases();done&&done();});}

function saveCurrentCase(){
  var need=F('caseNumber');
  if(!need.value.trim()){need.focus();alert(txt('msg_casereq'));return false;}
  var entryDate=openDate||selDate;
  var c=editId?getCase(editId):null;
  var isNew=!c;
  if(isNew){
    c={id:Date.now()+''+Math.floor(Math.random()*9999)};
    cases.unshift(c);
  }
  ensureLog(c);
  TOP_FIELDS.forEach(function(k){var el=F(k);c[k]=el?el.value.trim():'';});
  c.notes=F('docNotes').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  c.clientPhones=readPhoneBoxes(cliPhones).filter(Boolean);
  c.oppPartyPhones=readPhoneBoxes(oppPartyPhones).filter(Boolean);
  c.oppPhones=readPhoneBoxes(oppPhones).filter(Boolean);
  if(!c.files)c.files=[];
  var e=getEntry(c,entryDate);
  e.prevDate=F('lastDate').value.trim();
  e.prevProc=F('lastProc').value.trim();
  e.todayProc=F('todayProc').value.trim();
  e.nextDate=F('nextDate').value.trim();
  e.nextProc=F('nextProc').value.trim();
  var madeFuture=false;
  if(e.nextDate && e.nextDate!==entryDate && !c.log[e.nextDate]){
    c.log[e.nextDate]={prevDate:entryDate,prevProc:e.todayProc,todayProc:e.nextProc,nextDate:'',nextProc:''};
    madeFuture=true;
  }
  var picked=formFile.files;
  var finish=function(){
    if(saveCases()){
      editId=null; openDate=null;
      fsEl.textContent=txt('fs_new');
      clearForm(); resetGroups(); closeFormUI();
      clearDraft();
      render();
      if(madeFuture){
        alert('✅ '+txt('moved')+' '+fmtDate(e.nextDate)+'\n'+txt('safe_old')+' '+fmtDate(entryDate));
      }else if(isNew){
        alert('✅ '+txt('saved_new')+' '+fmtDate(entryDate));
      }else{
        alert('✅ '+txt('updated')+' '+fmtDate(entryDate));
      }
      return true;
    }
    return false;
  };
  if(picked&&picked.length){ addFilesToCase(picked,c,finish); return true; }
  return finish();
}

function approxVS(iso){var p=parseISO(iso); var y=p.y + (p.m0>=2?57:56); return (LANG==='en'?'Vikram Samvat ':'विक्रम संवत् ')+y;}
function loadHc(){
  try{return new Function('return import("https://cdn.jsdelivr.net/npm/hindu-calendar@latest/+esm")')();}
  catch(e){return Promise.reject(e);}
}
function hv(x){if(!x)return '';if(typeof x==='string')return x;return x.english||x.name||x.sanskrit||x.transliteration||x.in||'';}
function hp(res){
  var a=[];
  var m=hv(res.masa), p=hv(res.paksha), t=hv(res.tithi);
  if(m||p||t)a.push([m,p,t].filter(Boolean).join(' '));
  var v=hv(res.vaar); if(v)a.push(v);
  var n=hv(res.nakshatra); if(n)a.push(n);
  var y=hv(res.yoga); if(y)a.push(y);
  var k=hv(res.karana); if(k)a.push(k);
  return a.filter(Boolean).join(' • ');
}
function getHinduInfo(iso){
  return new Promise(function(resolve){
    var vs=approxVS(iso);
    // Construct Google Search URL for fallback
    var qq=(LANG==='en'?'Panchang ':'पंचांग ')+fmtDate(iso);
    var url='https://www.google.com/search?q='+encodeURIComponent(qq);
    
    var cachedKey='adam_hindu_panchang_'+iso+'_'+(new Date().getTimezoneOffset());
    try{var cc=JSON.parse(localStorage.getItem(cachedKey)); if(cc && cc.text){resolve(cc);return;}}catch(e){}
    
    loadHc().then(function(mod){
      var fn=mod.getDetails || (mod.default && mod.default.getDetails);
      if(!fn) throw 0;
      var p=parseISO(iso); var d=new Date(p.y,p.m0,p.d,12,0,0);
      var tz=-d.getTimezoneOffset()/60;
      var res=fn(d,{lat:28.6139,lng:77.2090,timezone:tz});
      var samvat=res.samvat||res.vikramSamvat||res.vikram||{};
      var vsYear=(samvat.vikram&&samvat.vikram.year)||samvat.year||(res.vikramSamvat&&res.vikramSamvat.year)||(res.vikram&&res.vikram.year);
      if(vsYear) vs=(LANG==='en'?'Vikram Samvat ':'विक्रम संवत् ')+vsYear;
      var pc=hp(res||{});
      
      // If we got detailed info, cache it WITHOUT the google link
      if(pc){
         var out={text: vs + (' • '+pc), url: '', ok: true};
         try{localStorage.setItem(cachedKey,JSON.stringify(out));}catch(e){}
         resolve(out);
      } else {
         // Fallback: Just VS year + Google Link
         resolve({text:vs, url:url, ok:false});
      }
    }).catch(function(){ 
       // Network Error / Library Fail: Show VS Year + Google Link Button
       resolve({text:vs, url:url, ok:false}); 
    });
  });
}
function updateHindu(){
  if(!calHindu)return;
  if(!calOpen || LANG==='en' || !SETTINGS.vs){calHindu.innerHTML='';return;}
  var req=++hinduReq;
  calHindu.innerHTML='⏳ '+(LANG==='en'?'Loading Panchang…':'पंचांग लोड…');
  getHinduInfo(selDate).then(function(info){
    if(req!==hinduReq)return;
    var html=esc(info.text||'');
    if(info.url){
      // This is the "Smart Backup": If online calc failed, show big clickable link
      html+=' <a href="'+info.url+'" target="_blank" rel="noopener" style="display:inline-block;margin-left:8px;background:var(--acc2);color:#06283d;padding:2px 8px;border-radius:6px;font-weight:700;">📅 '+(LANG==='en'?'View Panchang':'पंचांग देखें')+'</a>';
    }
    calHindu.innerHTML=html;
  }).catch(function(){ if(req===hinduReq)calHindu.innerHTML=''; });
}

function makeBackupJson(){return JSON.stringify({schemaVersion:2,appName:"Adam's Court Diary",exportedAt:new Date().toISOString(),lang:LANG,theme:THEME.mode,sections:LIB,cases:cases,settings:SETTINGS},null,2);}
function backupName(){var ts=new Date();return 'Adams_Court_Diary_Save_'+ts.getFullYear()+pad2(ts.getMonth()+1)+pad2(ts.getDate())+'_'+pad2(ts.getHours())+pad2(ts.getMinutes())+'.json';}
function triggerDownload(filename,text){var blob=new Blob([text],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},1500);}
function doSave(showToast){var fn=backupName();triggerDownload(fn,makeBackupJson());localStorage.setItem(BTKEY,String(Date.now()));if(showToast!==false)alert('✅ '+txt('msg_copy')+' '+fn+'\n\n'+txt('msg_copy2'));}
function saveToDrive(){var text=makeBackupJson();var fn=backupName();try{var file=new File([text],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Adam Court Diary Save'}).then(function(){localStorage.setItem(BTKEY,String(Date.now()));alert('✅ '+txt('msg_share'));}).catch(function(){doSave(true);});return;}}catch(e){}doSave(true);}
bkNow.addEventListener('click',function(){doSave(true);});
drvBtn.addEventListener('click',function(){saveToDrive();});
rsBtn.addEventListener('click',function(){rsFile.click();});
rsFile.addEventListener('change',function(){var f=rsFile.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(ev){try{var obj=JSON.parse(ev.target.result);if(!obj||!Array.isArray(obj.cases)){alert(txt('msg_badfile'));rsFile.value='';return;}var mode=confirm(txt('msg_merge'));if(mode){var map={};for(var i=0;i<cases.length;i++)map[cases[i].id]=cases[i];for(var j=0;j<obj.cases.length;j++){var nc=obj.cases[j];if(nc&&nc.id)map[nc.id]=nc;}cases=[];for(var k in map)cases.push(map[k]);}else{cases=obj.cases.slice();}for(var z=0;z<cases.length;z++){var cz=cases[z];if(!cz.holdingDate)cz.holdingDate=cz.nextDate||todayISO();if(!cz.files)cz.files=[];if(!cz.notes)cz.notes=[];if(!cz.clientPhones)cz.clientPhones=[];if(!cz.oppPhones)cz.oppPhones=[];if(!cz.oppPartyPhones)cz.oppPartyPhones=[];ensureLog(cz);}if(Array.isArray(obj.sections)&&obj.sections.length){LIB=obj.sections.slice();saveLib();}if(obj.settings){SETTINGS=obj.settings;if(SETTINGS.size==='small')SETTINGS.size='sm';if(SETTINGS.size==='medium')SETTINGS.size='md';if(SETTINGS.size==='large')SETTINGS.size='lg';if(typeof SETTINGS.vs!=='boolean')SETTINGS.vs=false;}if(obj.lang){LANG=obj.lang;}if(obj.theme){THEME.mode=obj.theme;}saveSettings();refreshAll();alert('✅ '+txt('msg_restored')+' '+cases.length+'.');}catch(err){alert(txt('msg_readerr'));}rsFile.value='';};rd.onerror=function(){alert(txt('msg_readerr'));rsFile.value='';};rd.readAsText(f);});
function maybeEveningPrompt(){var now=new Date();var hr=now.getHours();if(hr<20||hr>23)return;var last=parseInt(localStorage.getItem(BTKEY)||'0',10);var DAY=24*60*60*1000;if(last&&(Date.now()-last)<DAY)return;if(sessionStorage.getItem('adam_bp_shown'))return;sessionStorage.setItem('adam_bp_shown','1');bp.classList.add('on');}
bpYes.addEventListener('click',function(){bp.classList.remove('on');doSave(true);});
bpNo.addEventListener('click',function(){bp.classList.remove('on');});

function loadGis(cb){if(window.google&&window.google.accounts&&window.google.accounts.oauth2){cb();return;}var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=cb;s.onerror=function(){alert('Google script load nahi hui. Internet check karo.');};document.head.appendChild(s);}
gisBtn.addEventListener('click',function(){if(!GOOGLE_CLIENT_ID){alert(txt('msg_gisoff'));return;}loadGis(function(){try{google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',callback:function(resp){var text=makeBackupJson();var fn=backupName();var fd=new FormData();fd.append('metadata',new Blob([JSON.stringify({name:fn,mimeType:'application/json'})],{type:'application/json'}));fd.append('file',new Blob([text],{type:'application/json'}));fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Authorization':'Bearer '+resp.access_token},body:fd}).then(function(r){return r.json();}).then(function(){localStorage.setItem(BTKEY,String(Date.now()));alert('✅ Google Drive me save ho gaya.');}).catch(function(){alert('Drive upload error.');});}}).requestAccessToken();}catch(e){alert('GIS error: '+e.message);}});});

function syncSettingsUI(){
  for(var i=0;i<fontSizeRadios.length;i++)fontSizeRadios[i].checked=(fontSizeRadios[i].value===SETTINGS.size);
  boldToggle.checked=!!SETTINGS.bold;
  vsToggle.checked=!!SETTINGS.vs;
  for(var j=0;j<themeRadios.length;j++)themeRadios[j].checked=(themeRadios[j].value===THEME.mode);
  for(var k=0;k<langRadios.length;k++)langRadios[k].checked=(langRadios[k].value===LANG);
}
stBtn.addEventListener('click',function(){syncSettingsUI();sp.classList.add('on');});
sp.addEventListener('click',function(e){if(e.target===sp)sp.classList.remove('on');});
setSave.addEventListener('click',function(){
  var sz='md';for(var i=0;i<fontSizeRadios.length;i++){if(fontSizeRadios[i].checked){sz=fontSizeRadios[i].value;break;}}
  var th='night';for(var j=0;j<themeRadios.length;j++){if(themeRadios[j].checked){th=themeRadios[j].value;break;}}
  var lg='hi';for(var k=0;k<langRadios.length;k++){if(langRadios[k].checked){lg=langRadios[k].value;break;}}
  SETTINGS={size:sz,bold:boldToggle.checked,vs:vsToggle.checked};THEME.mode=th;LANG=lg;
  saveSettings();sp.classList.remove('on');refreshAll();
});

(function(){if(!localStorage.getItem(IKEY)){intro.removeAttribute('hidden');if(subEl)subEl.removeAttribute('hidden');localStorage.setItem(IKEY,'1');}if(ix)ix.addEventListener('click',function(){intro.setAttribute('hidden','');if(subEl)subEl.setAttribute('hidden','');});})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

applyI18n();buildPicker();renderLib();clearForm();loadDraft();render();maybeEveningPrompt();startAutoSave();
</script>
</body>
</html>
